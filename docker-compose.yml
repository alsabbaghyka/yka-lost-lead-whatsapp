# docker compose up -d --build
# then: docker compose exec app node cli.js create-admin --email it@example.com --name "IT Admin"
# Put an https reverse proxy (IIS / nginx / the corporate gateway) in front: Meta only calls https webhooks.
services:
  app:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      HOST: 0.0.0.0
      DB_PATH: /data/lost-lead.db
      BACKUP_DIR: /data/backups
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - lostlead-data:/data
volumes:
  lostlead-data:
